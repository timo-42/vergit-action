name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to release
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      phase:
        description: Optional pre-release phase (alpha, beta, or rc)
        required: false
        type: choice
        default: ''
        options:
          - ''
          - alpha
          - beta
          - rc
      tool-version:
        description: vergit release used to calculate the tag
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release tag
        id: version
        uses: ./
        with:
          tool-version: ${{ inputs.tool-version }}
          next: ${{ inputs.bump }}
          next-phase: ${{ inputs.phase }}
          with-prefix: 'true'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
