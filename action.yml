name: vergit
description: Generate a PEP 440 version string from git state.
author: timo

inputs:
  tool-version:
    description: Release of the `vergit` tool to download, or `latest`.
    default: v0.1.0
  tool-repository:
    description: >-
      Repository hosting the `vergit` releases, as `owner/name`.
    default: timo-42/vergit
  tool-server:
    description: >-
      Server hosting `tool-repository`, without a trailing slash. Set this to
      your Gitea instance when downloading a self-hosted vergit release.
    default: https://github.com
  tag-prefix:
    description: Tag prefix to match and strip.
    default: v
  no-local:
    description: Omit the +local label. Required when publishing to PyPI.
    default: 'false'
  next:
    description: >-
      Print the next version to tag instead of describing this commit:
      `major`, `minor` or `patch`.
    default: ''
  next-phase:
    description: >-
      Make the next version a pre-release: `alpha`, `beta` or `rc`.
      May be combined with `next`.
    default: ''
  with-prefix:
    description: Prepend the tag prefix to `next` output, ready for `git tag`.
    default: 'false'
  fetch-tags:
    description: >-
      Deepen a shallow checkout first. Shallow checkouts hide tags, which
      prevents the version from being derived.
    default: 'true'
  working-directory:
    description: Directory to read git state from.
    default: '.'

outputs:
  version:
    description: The generated version string.
    value: ${{ steps.generate.outputs.version }}

runs:
  using: composite
  steps:
    - name: Fetch tags
      if: inputs.fetch-tags == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --tags --force --unshallow
        else
          git fetch --tags --force
        fi

    - name: Install vergit
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.tool-version }}
        REPO: ${{ inputs.tool-repository }}
        SERVER: ${{ inputs.tool-server }}
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux)  os=unknown-linux-musl ;;
          Darwin) os=apple-darwin ;;
          MINGW*|MSYS*|CYGWIN*) os=pc-windows-msvc ;;
          *)
            echo "unsupported OS: $(uname -s)" >&2
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  arch=x86_64 ;;
          aarch64|arm64) arch=aarch64 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        target="${arch}-${os}"
        suffix=""
        case "$target" in *windows*) suffix=".exe" ;; esac

        if [ "$TOOL_VERSION" = "latest" ]; then
          release_url="${SERVER}/${REPO}/releases/latest/download"
        else
          release_url="${SERVER}/${REPO}/releases/download/${TOOL_VERSION}"
        fi

        dir="${RUNNER_TEMP:-/tmp}/vergit-tool"
        mkdir -p "$dir"
        asset="vergit-${target}.zip"
        archive="${dir}/${asset}"
        if ! curl --fail --silent --show-error --location --retry 3 \
          --output "$archive" "${release_url}/${asset}"; then
          echo "could not download ${asset} from ${release_url}" >&2
          echo "For Gitea, set tool-server and pin tool-version to a release tag." >&2
          exit 1
        fi
        if command -v unzip >/dev/null 2>&1; then
          unzip -q -o "$archive" -d "$dir"
        elif ! tar -xf "$archive" -C "$dir" 2>/dev/null; then
          echo "could not extract ${asset}; install unzip" >&2
          exit 1
        fi
        chmod +x "${dir}/vergit${suffix}"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Generate
      id: generate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        NO_LOCAL: ${{ inputs.no-local }}
        NEXT: ${{ inputs.next }}
        NEXT_PHASE: ${{ inputs.next-phase }}
        WITH_PREFIX: ${{ inputs.with-prefix }}
      run: |
        set -euo pipefail
        args=(pep440 --tag-prefix "$TAG_PREFIX")

        case "$NEXT" in
          '')                 ;;
          major|minor|patch)  args+=("--next-$NEXT") ;;
          *) echo "::error::next must be major, minor or patch (got '$NEXT')"; exit 1 ;;
        esac
        case "$NEXT_PHASE" in
          '')          ;;
          alpha|beta)  args+=("--next-$NEXT_PHASE") ;;
          rc)          args+=(--next-rc) ;;
          *) echo "::error::next-phase must be alpha, beta or rc (got '$NEXT_PHASE')"; exit 1 ;;
        esac

        # --no-local and --with-prefix each apply to only one of the two modes.
        if [ -z "$NEXT$NEXT_PHASE" ]; then
          [ "$NO_LOCAL" = "true" ] && args+=(--no-local) || true
        else
          [ "$WITH_PREFIX" = "true" ] && args+=(--with-prefix) || true
        fi

        generated="$(vergit "${args[@]}")"
        echo "version=${generated}" >> "$GITHUB_OUTPUT"
        echo "$generated"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "### \`$generated\`" >> "$GITHUB_STEP_SUMMARY"
        fi

branding:
  icon: tag
  color: purple
